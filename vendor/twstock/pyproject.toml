[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twstock"
description = "Taiwan Stock Utility"
authors = [
    {name = "Louie Lu", email = "git@louie.lu"},
]
maintainers = [
    {name = "Louie Lu", email = "git@louie.lu"},
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.33.0",
    "lxml",
]
# Vendored snapshot of upstream twstock. Verified byte-identical to PyPI 1.5.1
# (line endings aside), so the version is pinned rather than derived from git
# tags -- this checkout has none, and dynamic versioning would resolve to 0.0.0.
version = "1.5.1"

[project.urls]
homepage = "https://github.com/mlouielu/twstock"
repository = "https://github.com/mlouielu/twstock"

[project.scripts]
twstock = "twstock.cli:run"

[dependency-groups]
dev = [
    "coverage",
    "coveralls",
    "codecov",
    "vcrpy",
    "wheel",
]
