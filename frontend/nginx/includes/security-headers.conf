# Response headers sent on every route.
#
# This file is `include`d **once per location** rather than once at server
# level, because nginx's add_header does not merge: a block that declares any
# add_header of its own discards every header inherited from its parent. The
# /assets/ block below sets Cache-Control, which would silently drop the whole
# security header set if these lived only in `server {}`.
#
# Content-Security-Policy is the one that earns its keep here. The access token
# is kept in localStorage (see the auth section of README.md), so any script
# that executes on this origin can read it; `script-src 'self'` is what stops an
# injected <script src=...> or an inline payload from being that script. The
# other headers are cheap and uncontroversial.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# 'unsafe-inline' above applies to styles only, and is not a hole in the line
# above it: React writes style props through the CSSOM (element.style.x), which
# CSP does not govern at all, but Recharts also emits `style` attributes on the
# SVG it renders, and those are blocked without it. Styles cannot exfiltrate the
# token; scripts can, and scripts stay locked to 'self'.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;              # for browsers predating frame-ancestors
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Empty-valued headers are omitted by nginx, so $hsts (mapped from $scheme in
# conf.d/00-maps.conf) makes this a no-op until the request actually arrived
# over TLS. HSTS announced over plain HTTP is ignored by browsers anyway, and
# announcing it before TLS works is how a hostname becomes unreachable.
add_header Strict-Transport-Security $hsts always;
