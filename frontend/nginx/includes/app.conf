# The application itself: everything both the HTTP-only and the TLS server
# blocks need. Included from inside `server {}`, so it may only contain
# directives legal in that context.

root  /usr/share/nginx/html;
index index.html;

gzip            on;
gzip_types      text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Hashed asset filenames from vite -- safe to cache hard.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/includes/security-headers.conf;
}

# react-router owns the client-side routes, so unknown paths must still
# return the shell rather than a 404.
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/includes/security-headers.conf;
}

# Same-origin API: the browser only ever sees /api, so CORS never applies.
location /api/ {
    proxy_pass       http://server:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API echoes this back on the response and stamps it on every log line
    # it writes while handling the request. See server/app/middleware.py.
    proxy_set_header X-Request-ID      $req_id;

    # A cold 12-month history sits in the TWSE rate limiter for ~20s, and
    # the whole request can take considerably longer than nginx's 60s default.
    proxy_connect_timeout 10s;
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;

    include /etc/nginx/includes/security-headers.conf;
}

# FastAPI's own docs, handy when the API port is not published.
#
# Swagger UI and ReDoc are built from a CDN bundle and inline bootstrap script,
# which the CSP above blocks outright. These two paths therefore deliberately
# get no security headers: they are developer tooling on an admin's own
# machine, and a CSP that breaks the page it protects only teaches people to
# turn it off. Do not publish this port on an untrusted network.
location ~ ^/(docs|redoc|openapi\.json) {
    proxy_pass       http://server:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
}
