# Default server config: plain HTTP, no certificate required.
#
# The entrypoint replaces this with https.conf when a certificate is mounted --
# see nginx/entrypoint/20-select-server-conf.sh.

server {
    listen      80;
    server_name _;

    # Container healthcheck. Kept out of app.conf so it exists on port 80 in
    # both modes: in TLS mode everything else on 80 is redirected, and a
    # healthcheck that follows the redirect into a self-signed certificate
    # reports the container unhealthy for the wrong reason.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/includes/app.conf;
}
