# Installed as default.conf by the entrypoint when
# /etc/nginx/certs/{fullchain.pem,privkey.pem} are both present.
#
# Certificates are mounted, never baked in: an image carrying a private key is
# an image that cannot be pushed anywhere. See the TLS section of README.md.

server {
    listen      80;
    server_name _;

    # See http.conf -- must answer on 80 without a redirect.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Everything else is TLS-only. 301 rather than 308 because the redirect
    # exists for people typing a bare hostname; a browser that has seen the
    # HSTS header will not come back here at all.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 is still here for older corporate clients; 1.0/1.1 are not.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # 1.3 suites are fixed; let the client pick
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/includes/app.conf;
}
