# http-context helpers shared by whichever server config the entrypoint picks.
# Loaded before default.conf because conf.d is read in filename order.

# http context, so it also covers nginx's own error pages and the port-80
# redirect -- neither of which includes app.conf. Version numbers in a
# Server header are free reconnaissance and buy nobody anything.
server_tokens off;

# HSTS is only meaningful -- and only honoured -- over TLS. nginx drops an
# add_header whose value evaluates to the empty string, so this is what lets
# one shared security-headers.conf serve both the plain-HTTP and the TLS
# server blocks without announcing a policy the deployment cannot keep.
map $scheme $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# One id per request, carried through to the API so a line in the nginx access
# log and a line in the uvicorn log can be tied to the same request. An id set
# by a proxy in front of us wins: whatever is furthest upstream owns the trace.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format main_with_id '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rid=$req_id rt=$request_time';

access_log /var/log/nginx/access.log main_with_id;
