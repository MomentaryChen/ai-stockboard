server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames from vite -- safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router owns the client-side routes, so unknown paths must still
    # return the shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: the browser only ever sees /api, so CORS never applies.
    location /api/ {
        proxy_pass       http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold 12-month history sits in the TWSE rate limiter for ~20s, and
        # the whole request can take considerably longer than nginx's 60s default.
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # FastAPI's own docs, handy when the API port is not published.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass       http://server:8000;
        proxy_set_header Host $host;
    }
}
