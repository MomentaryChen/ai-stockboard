[project]
name = "ai-stockboard-server"
version = "0.1.0"
description = "ai-stockboard API — Taiwan stock market dashboard with traditional and AI-assisted analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    # Schema migrations. `create_all` only ever creates missing tables, so
    # anything that is not a brand-new table -- a type change, a composite
    # index, a dropped column -- has no unattended path without this.
    "alembic>=1.14",
    "python-dotenv>=1.0",
    # Market data source: TWSE/TPEX fetchers, stock code database, technical
    # analytics. Vendored under ../vendor/twstock and installed editable, so the
    # library can be adapted as the AI analysis engine takes shape.
    "twstock",
    # Auth: JWT encode/decode, password hashing, and EmailStr validation.
    "pyjwt>=2.10",
    "bcrypt>=4.1",
    # zoneinfo's database. The stdlib module reads the *system* tzdb, which a
    # slim image may not carry and Windows never does -- and SCHEDULER_TIMEZONE
    # decides when the "每天 03:00" jobs actually fire.
    "tzdata>=2024.1",
    # AI analysis. The engine is Gemini specifically, not "an LLM": the stored
    # verdicts carry the model name, so swapping providers is a migration, not a
    # config change. Kept behind app/services/analysis/gemini.py all the same,
    # so that migration is one module.
    "google-genai>=1.0",
]

[tool.uv.sources]
twstock = { path = "../vendor/twstock", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
