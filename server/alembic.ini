# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent. alembic/env.py builds the URL from
# the same settings object the application uses, so there is exactly one place
# that knows how to reach the database, no credentials sit in a tracked file,
# and a migration cannot be run against a URL that has drifted from the
# server's own.
#
#   cd server
#   uv run alembic current
#   uv run alembic revision --autogenerate -m "add composite index"
#   uv run alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .

# Timestamp first so a directory listing reads in the order the migrations were
# written. The revision graph, not the filename, is still what orders upgrades.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# ---------------------------------------------------------------------------
# Logging, used only when Alembic runs from the command line. The application
# configures its own logging and passes configure_logging=False (see
# app/migrations.py), so a boot-time upgrade does not clobber it.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
